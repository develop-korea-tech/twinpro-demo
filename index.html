<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TWIN PRO 운영 모니터링</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>/* Layout: 왼쪽 220px 남색 사이드바 + 상단 상태칩 헤더 + 탭 + 흰 콘텐츠 카드(패널 그리드). 01H Figma 확정안과 같은 단일 라이트 테마(관제 화면 고정 톤). */
:root {
  --side: #002554; --side-hi: rgba(255,255,255,.12); --side-fg: #DCE6F5; --side-dim: #9DB3D6;
  --pri: #003087; --pri-tint: #E8EEF8; --bg: #F2F4F7; --card: #FFFFFF; --label: #F3F5F8; --row-hi: #EAF0F8;
  --fg: #1B2433; --fg2: #535D6C; --fg3: #6B7584; --line: #E1E5EB; --line2: #D8DEE6;
  --g: #008233; --g-bg: #E3F3E8; --o: #C76F00; --o-bg: #FFF3DF; --r: #D63B32; --r-bg: #FDECEA; --r-line: #F1A7A1;
  --p: #7353CF; --p-bg: #F0EBFC; --b: #2B74DE; --b-bg: #E7F0FD; --n: #6B7280; --n-bg: #F0F1F3; --icon: #2E3F57;
  --P01: #0EA5E9; --P02: #6366F1; --P03: #F97316; --P04: #06B6D4; --P05: #EC4899; --P06: #EAB308;
  --font: 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pri); outline-offset: 1px; }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; background: linear-gradient(to right, var(--side) 220px, var(--bg) 220px); }
/* sidebar */
.side { background: var(--side); color: var(--side-fg); padding: 18px 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
.logo { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
.logo b { width: 30px; height: 30px; border-radius: 6px; background: #6E9BE0; color: #fff; display: grid; place-items: center; font-size: 12px; }
.logo strong { display: block; font-size: 15px; color: #fff; letter-spacing: .02em; }
.logo small { font-size: 11px; color: var(--side-dim); }
.side h6 { margin: 12px 0 2px; font-size: 11px; font-weight: 500; color: var(--side-dim); }
.nav { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--side-fg); padding: 9px 12px; border-radius: 4px; }
.nav::before { content: '•'; margin-right: 8px; opacity: .6; }
.nav.on { background: var(--side-hi); color: #fff; font-weight: 700; }
.side .databox { margin-top: auto; background: rgba(255,255,255,.08); border-radius: 6px; padding: 12px; font-size: 11px; color: var(--side-dim); }
.databox b { display: block; color: #fff; font-size: 13px; margin: 2px 0; }
/* header */
.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 24px; flex-wrap: wrap; background: var(--card); }
.chip { border-radius: 999px; padding: 4px 12px; font-size: 12px; border: 1px solid transparent; background: var(--pri-tint); color: var(--pri); }
.chip.warn { background: var(--o-bg); color: var(--o); border-color: #F2C677; }
.chip.alert { background: var(--r-bg); color: var(--r); border: 0; }
.chip.alert::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--r); margin-right: 6px; }
.clock { display: inline-flex; align-items: center; gap: 4px; }
.btn { border: 1px solid var(--line2); background: var(--card); border-radius: 4px; padding: 5px 12px; font-size: 12px; white-space: nowrap; }
.btn.pri { background: var(--pri); color: #fff; border-color: var(--pri); font-weight: 600; }
.btn.line { border-color: var(--pri); color: var(--pri); }
.btn.danger { border-color: var(--r-line); color: var(--r); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.tabs { display: flex; gap: 4px; padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 1px solid var(--line); border-bottom: 0; background: var(--card); padding: 8px 16px; border-radius: 6px 6px 0 0; color: var(--fg2); white-space: nowrap; }
.tab.on { background: var(--pri); color: #fff; border-color: var(--pri); font-weight: 700; }
.content { margin: 16px 24px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ptitle { display: flex; justify-content: space-between; align-items: center; }
.ptitle h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
.ptitle h1::before { content: ''; width: 12px; height: 12px; border: 2px solid var(--pri); box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 6px var(--pri); }
.crumb { color: var(--fg3); font-size: 12px; }
/* panels */
.grid { display: grid; gap: 16px; min-width: 0; }
.g-dash { grid-template-columns: minmax(0, 1fr) minmax(340px, 0.37fr); }
.g-eq { grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr); }
.g-prod { grid-template-columns: minmax(0, 1fr) minmax(380px, 0.45fr); }
.g-wo { grid-template-columns: minmax(0, 1fr) minmax(440px, 0.55fr); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.panel { border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; gap: 12px; background: var(--card); }
.ph { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ph h2 { margin: 0; font-size: 15px; padding-left: 9px; border-left: 3px solid var(--pri); }
.ph .sub { color: var(--fg3); font-size: 12px; }
.ph .grow { flex: 1; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.g { color: var(--g); background: var(--g-bg); } .badge.o { color: var(--o); background: var(--o-bg); }
.badge.r { color: var(--r); background: var(--r-bg); } .badge.p { color: var(--p); background: var(--p-bg); }
.badge.b { color: var(--b); background: var(--b-bg); } .badge.n { color: var(--n); background: var(--n-bg); }
.badge.delay { color: var(--r); background: var(--card); border: 1px solid var(--r); }
/* KPI */
.kpis { display: grid; grid-template-columns: repeat(5, 1fr) 1.35fr 1.35fr 1.35fr; border: 1px solid var(--line); border-radius: 6px; }
.kpi { padding: 14px 18px; border-left: 1px solid var(--line); }
.kpi:first-child { border-left: 0; }
.kpi span { font-size: 12px; color: var(--fg2); }
.kpi b { display: block; font-size: 28px; line-height: 1.2; }
.kpi b small { font-size: 12px; color: var(--fg3); font-weight: 400; margin-left: 4px; }
.c-g { color: var(--g); } .c-o { color: var(--o); } .c-r { color: var(--r); } .c-p { color: var(--p); } .c-b { color: var(--b); }
/* table */
.tw { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; }
th { background: var(--label); color: var(--fg2); font-weight: 500; text-align: left; padding: 9px 10px; font-size: 12px; white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr.sel td { background: var(--row-hi); }
tbody tr[data-act] { cursor: pointer; }
tbody tr[data-act]:hover td { background: #F6F8FB; }
tbody tr.sel[data-act]:hover td { background: var(--row-hi); }
td.num, th.num { text-align: right; }
td.c, th.c { text-align: center; }
.small { font-size: 11px; color: var(--fg3); }
.warn-t { color: var(--r); font-size: 12px; }
.bar { display: inline-flex; align-items: center; gap: 8px; }
.bar i { width: 80px; height: 5px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; display: inline-block; }
.bar i em { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.bar small { color: var(--fg2); font-size: 12px; min-width: 42px; }
/* flow */
.flow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.step { border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 5px; position: relative; text-align: left; background: var(--card); min-width: 0; }
.step.fault { border-color: var(--r-line); background: #FFF8F7; }
.step + .step::before { content: '›'; position: absolute; left: -10px; top: 45%; color: var(--fg3); }
.step .t { font-weight: 700; font-size: 13px; } .step .t small { color: var(--fg3); font-weight: 400; margin-right: 4px; }
.ico { color: var(--icon); display: grid; place-items: center; height: 92px; }
.ico svg { height: 76px; max-width: 100%; }
.step .blk { color: var(--pri); font-weight: 700; }
.step .eqn { font-size: 11px; color: var(--fg3); }
.legend { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--fg2); }
/* lists */
.chk { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.chk .grow { flex: 1; min-width: 0; }
.chk .l1 { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.chk .l2 { font-size: 12px; color: var(--fg3); margin-top: 2px; }
/* search box */
.search { display: flex; gap: 12px; flex-wrap: wrap; background: var(--label); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; align-items: center; }
.field { display: flex; border: 1px solid var(--line2); border-radius: 4px; background: var(--card); overflow: hidden; min-height: 34px; }
.field > label, .field > span.lb { background: var(--label); color: var(--fg2); padding: 7px 12px; min-width: 90px; border-right: 1px solid var(--line2); }
.field > .in { display: flex; align-items: center; gap: 10px; padding: 0 10px; }
.field input[type=text], .field input[type=number], .field select { border: 0; background: transparent; padding: 6px 2px; min-width: 120px; outline: none; }
.radios { display: inline-flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.radios label { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.radios input { accent-color: var(--pri); margin: 0; }
/* form */
.form { border: 1px solid var(--line); border-radius: 4px; }
.frow { display: grid; grid-template-columns: 120px minmax(0, 1fr); border-bottom: 1px solid var(--line); }
.frow:last-child { border-bottom: 0; }
.frow > span { background: var(--label); color: var(--fg2); padding: 10px 12px; }
.frow > div { padding: 6px 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.frow input, .frow select, .frow textarea { border: 1px solid var(--line2); border-radius: 4px; padding: 6px 10px; background: var(--card); width: 100%; }
.frow input[readonly] { background: var(--label); color: var(--fg3); }
.req::after { content: ' *'; color: var(--r); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; width: 100%; }
.seg button { border: 0; background: var(--card); padding: 7px 0; border-left: 1px solid var(--line2); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--pri); color: #fff; font-weight: 700; }
.note { background: var(--pri-tint); border-radius: 6px; padding: 10px 14px; font-size: 12px; color: var(--fg2); }
.note b { color: var(--pri); display: block; margin-bottom: 2px; }
.alertbox { border: 1px solid var(--r-line); background: #FFF8F7; border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.alertbox textarea { width: 100%; min-height: 64px; border: 1px solid var(--line2); border-radius: 4px; padding: 8px 10px; resize: vertical; background: var(--card); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .grow { flex: 1; }
.info { display: grid; grid-template-columns: 96px 1fr 96px 1fr; border: 1px solid var(--line); border-radius: 4px; }
.info > * { padding: 8px 10px; border-bottom: 1px solid var(--line); min-width: 0; }
.info > span { background: var(--label); color: var(--fg2); font-size: 12px; }
.info > :nth-last-child(-n+4) { border-bottom: 0; }
.det-top { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; }
.det-ico { border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; color: var(--icon); }
.det-ico svg { height: 110px; max-width: 80%; }
/* timeline */
.tl { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 12px; color: var(--fg2); }
.tl .lane { position: relative; height: 22px; background: var(--n-bg); border-radius: 2px; overflow: hidden; }
.tl .lane i { position: absolute; top: 0; bottom: 0; }
.tl .axis { position: relative; height: 16px; font-size: 11px; color: var(--fg3); }
.tl .axis span { position: absolute; transform: translateX(-50%); }
.tl .axis span:first-child { transform: none; } .tl .axis span:last-child { transform: translateX(-100%); }
/* stage cells */
.stages { display: inline-flex; gap: 3px; }
.stages i { width: 15px; height: 7px; border-radius: 2px; background: var(--line); display: inline-block; }
.stages i.cur { background: var(--card); border: 1.5px solid; }
.pa { display: flex; flex-direction: column; gap: 4px; }
.pa .h { display: flex; justify-content: space-between; font-size: 12px; }
.pa .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.pa .track em { display: block; height: 100%; border-radius: 3px; }
.pager { display: flex; justify-content: center; gap: 6px; }
.pager button { min-width: 28px; border: 1px solid var(--line2); background: var(--card); border-radius: 4px; padding: 3px 6px; }
.pager button.on { background: var(--pri); color: #fff; border-color: var(--pri); }
.subtabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); }
.subtabs button { border: 0; background: none; padding: 6px 0 8px; font-size: 15px; color: var(--fg3); border-bottom: 2px solid transparent; }
.subtabs button.on { color: var(--fg); font-weight: 700; border-color: var(--pri); }
.subtabs small { background: var(--pri-tint); color: var(--pri); border-radius: 999px; padding: 0 7px; font-size: 11px; margin-left: 6px; }
.toggle { width: 36px; height: 20px; border-radius: 10px; background: var(--pri); position: relative; display: inline-block; }
.toggle::after { content: ''; position: absolute; right: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
.toggle.off { background: var(--line2); } .toggle.off::after { right: auto; left: 3px; }
.sw { width: 22px; height: 10px; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 6px; }
.links { display: flex; gap: 6px; flex-wrap: wrap; }
.events { font-size: 12px; color: var(--fg2); max-height: 120px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.clip { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--fg3); padding: 18px; text-align: center; border: 1px dashed var(--line2); border-radius: 6px; }
.toast { position: fixed; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 460px; background: var(--fg); color: #fff; padding: 12px 16px; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.18); font-size: 13px; z-index: 10; }
.toast.ng { background: var(--r); }
.blank-gap { flex: 1; }
@media (max-width: 1280px) {
  .kpis { grid-template-columns: repeat(4, 1fr); } .kpi:nth-child(5) { border-left: 0; } .kpi:nth-child(n+5) { border-top: 1px solid var(--line); }
  .flow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .step:nth-child(3n+1)::before { content: none; }
}
@media (max-width: 1500px) { .g-eq { grid-template-columns: minmax(0, 1fr); } .g-eq > .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 1100px) {
  .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .app { grid-template-columns: 1fr; background: var(--bg); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; }
  .side h6, .side .databox { display: none; } .logo { margin: 0 12px 0 0; }
  .nav { width: auto; }
  .grid { grid-template-columns: minmax(0, 1fr) !important; }
  .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .content { margin: 12px 16px 16px; padding: 14px 16px; }
  .top, .tabs { padding-inline: 16px; }
}
@media (max-width: 640px) {
  .g-4 { grid-template-columns: minmax(0, 1fr) !important; }
  .kpis { grid-template-columns: repeat(2, 1fr); } .kpi { border-left: 0; border-top: 1px solid var(--line); }
  .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } .step::before { content: none !important; }
  .det-top { grid-template-columns: 1fr; } .info { grid-template-columns: 90px 1fr; } .info > :nth-last-child(-n+4) { border-bottom: 1px solid var(--line); }
  .field { flex-wrap: wrap; } .field input[type=text] { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* AI 운영 요약 */
.ai-box { border: 1px solid var(--pri); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: color-mix(in srgb, var(--pri) 4%, var(--card)); }
.ai-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ai-h b { color: var(--pri); }
.ai-h .btn { margin-left: auto; }
.ai-h .btn small { opacity: .8; font-weight: 400; margin-left: 4px; }
.ai-text { white-space: pre-wrap; font-size: 12.5px; line-height: 1.6; max-height: 260px; overflow: auto; color: var(--fg); }

/* 패널 안 탭(운영 요약 AI/규칙, 설비 이력/신호) */
.ptabs { display: inline-flex; border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; }
.ptabs button { border: 0; background: var(--card); padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--fg3); border-left: 1px solid var(--line2); }
.ptabs button:first-child { border-left: 0; }
.ptabs button.on { background: var(--pri); color: #fff; }
.ptabs small { font-weight: 400; opacity: .85; }

/* 한 화면 맞춤(1920×1080 등 큰 화면): 페이지는 스크롤 없이 화면 높이에 맞추고, 긴 표·패널만 안에서 스크롤 */
@media (min-width: 1100px) and (min-height: 640px) {
  .app, .main { height: 100vh; }
  .main { min-height: 0; }
  .top { padding: 8px 24px; }
  .tab { padding: 6px 16px; }
  .content { flex: 1; min-height: 0; overflow: hidden; margin: 10px 20px 12px; padding: 12px 20px 14px; gap: 10px; }
  .ptitle h1 { font-size: 18px; }
  .search { padding: 8px 14px; }
  .kpi { padding: 8px 16px; } .kpi b { font-size: 26px; }
  .panel { padding: 12px 16px; gap: 8px; } .pa { gap: 2px; }
  th { padding: 6px 10px; } td { padding: 6px 10px; }
  .ico { height: 64px; } .ico svg { height: 54px; }
  .step { gap: 3px; padding: 8px 10px; }
  .chk { padding: 8px 12px; }
  .det-ico svg { height: 70px; }
  .content > .grid:last-child, .content > .panel:last-child { flex: 1; min-height: 0; grid-auto-rows: minmax(0, 1fr); }
  .content > .grid:last-child > .grid { min-height: 0; grid-template-rows: auto minmax(0, 1fr); grid-auto-rows: auto; }
  .content > .grid:last-child .panel, .content > .panel:last-child { min-height: 0; overflow: auto; }
  .content > .g-dash:last-child { grid-template-rows: auto minmax(0, 1fr); }
  .ai-text { max-height: none; }
  .content > .grid:last-child .panel > *, .content > .panel:last-child > * { flex-shrink: 0; }
  .tl { gap: 4px 10px; } .tl .lane { height: 16px; }
  .det-top { grid-template-columns: 150px minmax(0, 1fr); } .info > * { padding: 6px 10px; }
  .alertbox { padding: 10px 12px; gap: 6px; } .alertbox textarea { min-height: 40px; }
  .frow > span { padding: 8px 12px; } .frow > div { padding: 4px 10px; }
}

/* 한 화면 맞춤 · 중간 크기(노트북·창 모드 1100~1500px): 사이드바 대신 위 탭 사용, 글자·간격 축소, 열 배치는 큰 화면과 같게 */
@media (min-width: 1100px) and (max-width: 1500px) and (min-height: 640px) {
  .app { grid-template-columns: minmax(0, 1fr); background: var(--bg); }
  .side { display: none; }
  body { font-size: 12px; }
  .kpis { grid-template-columns: repeat(5, 1fr) 1.35fr 1.35fr 1.35fr; } .kpi:nth-child(n) { border-top: 0; } .kpi:nth-child(5) { border-left: 1px solid var(--line); }
  .kpi { padding: 6px 10px; } .kpi b { font-size: 22px; } .kpi span { font-size: 11px; }
  .flow { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; } .step:nth-child(3n+1)::before { content: '›'; } .step:first-child::before { content: none; }
  .ico { height: 48px; } .ico svg { height: 40px; }
  .g-dash { grid-template-columns: minmax(0, 1fr) minmax(300px, 0.42fr); }
  .g-eq { grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr); } .g-eq > .grid { grid-template-columns: minmax(0, 1fr); }
  .g-prod { grid-template-columns: minmax(0, 1fr) minmax(320px, 0.5fr); }
  .g-wo { grid-template-columns: minmax(0, 1fr) minmax(380px, 0.6fr); }
  th, td { padding: 5px 8px; } th { font-size: 11px; }
  .content { margin: 8px 12px 10px; padding: 10px 14px; }
  .top { padding: 6px 12px; } .tabs { padding: 0 12px; }
  .ph h2 { font-size: 14px; } .ptitle h1 { font-size: 16px; }
  .bar i { width: 56px; } .clip { max-width: 180px; }
  .det-top { grid-template-columns: 110px minmax(0, 1fr); } .det-ico svg { height: 56px; }
  .info { grid-template-columns: 80px 1fr 80px 1fr; }
  .search { gap: 8px; padding: 6px 10px; } .field > span.lb { min-width: 64px; padding: 5px 8px; } .field { min-height: 30px; }
}

/* 표 행 높이 일정하게: 배지·진행 막대가 들어가도 줄 높이가 같도록 */
td { vertical-align: middle; }
.badge { line-height: 18px; }
.badge.delay { line-height: 16px; }
.bar { height: 18px; vertical-align: middle; }
.bar small { line-height: 18px; }
td .small { line-height: 18px; }
.warn-t { line-height: 18px; display: inline-block; }
.ell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 1500px) { .ell { max-width: 160px; } }

/* 지금 상황 한 줄 + 재생 상태 */
.chip.live { background: var(--g-bg); color: var(--g); font-weight: 600; }
.nowline { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; background: var(--label); font-size: 13px; }
.nowline .st { font-weight: 700; white-space: nowrap; padding: 2px 10px; border-radius: 999px; background: var(--n-bg); color: var(--fg2); }
.nowline .st.live { background: var(--g-bg); color: var(--g); }
.nowline .msg { flex: 1; min-width: 0; }
.nowline .hint { font-size: 12px; color: var(--fg3); white-space: nowrap; }
/* 재생 중일 때만 공정이 움직인다(시간이 멈추면 정지) */
@keyframes tpStripe { to { background-position: 24px 0; } }
@keyframes tpBob { 50% { transform: translateY(-3px); } }
.flow.live .step.run { border-color: var(--g); box-shadow: 0 0 0 2px var(--g-bg); }
.flow.live .step.run .bar em { background-image: linear-gradient(45deg, rgba(255,255,255,.5) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.5) 50%, rgba(255,255,255,.5) 75%, transparent 75%) !important; background-size: 12px 12px !important; animation: tpStripe .8s linear infinite; }
.flow.live .step.run .ico svg { animation: tpBob 1.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .flow.live .step.run .bar em, .flow.live .step.run .ico svg { animation: none; } }
@media (max-width: 1100px) { .nowline { flex-wrap: wrap; } .nowline .hint { white-space: normal; } }

/* ===== 재설계: 문제 카드 · KPI 4칸 · 처리 안내 · 첫 안내 ===== */
.chip.share { background: var(--b-bg); color: var(--b); }
.chip.share.flash { background: var(--o-bg); color: var(--o); font-weight: 600; }
.hero-row { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; }
.hero { border: 1px solid var(--line); border-left: 6px solid var(--g); border-radius: 6px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--card); min-width: 0; }
.hero.bad { border-left-color: var(--r); background: #FFF8F7; }
.hero.mid { border-left-color: var(--o); background: #FFFBF3; }
.hero-main { display: flex; gap: 16px; align-items: center; }
.hero-main > div { flex: 1; min-width: 0; }
.hero-t { font-size: 18px; font-weight: 700; }
.hero.bad .hero-t { color: var(--r); }
.hero-s { color: var(--fg2); font-size: 13px; margin-top: 2px; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 6px; font-size: 12px; }
.dots i { color: var(--fg3); font-style: normal; }
.dot { padding: 1px 8px; border-radius: 999px; background: var(--n-bg); color: var(--fg3); }
.dot.done { background: var(--g-bg); color: var(--g); }
.dot.on { background: var(--pri); color: #fff; font-weight: 600; }
.btn.big { padding: 10px 18px; font-size: 14px; }
.hero-foot { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--fg2); border-top: 1px dashed var(--line2); padding-top: 6px; }
.hero-foot .hint { margin-left: auto; color: var(--fg3); }
.hero-foot .hint.live { color: var(--g); font-weight: 600; }
.kgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 6px; align-content: stretch; position: relative; }
.kgrid .kpi { border-left: 1px solid var(--line); border-top: 1px solid var(--line); padding: 8px 14px; }
.kgrid .kpi:nth-child(odd) { border-left: 0; } .kgrid .kpi:nth-child(-n+2) { border-top: 0; }
.kgrid .kpi.more { display: none; }
.kgrid.open .kpi.more { display: block; }
.kgrid.open { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kgrid.open .kpi:nth-child(odd) { border-left: 1px solid var(--line); } .kgrid.open .kpi:nth-child(4n+1) { border-left: 0; } .kgrid.open .kpi:nth-child(-n+4) { border-top: 0; }
.kgrid.open .kpi:nth-child(n+5) { border-top: 1px solid var(--line); }
.kmore { position: absolute; right: 6px; bottom: 4px; border: 0; background: none; color: var(--pri); font-size: 11px; }
.chk .btns { display: flex; gap: 4px; flex: none; }
/* 모달 */
.modal-bg { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal { background: var(--card); border-radius: 8px; width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.ctx { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 6px; }
.ctx > div, .ctx > button { padding: 6px 10px; border: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; background: none; text-align: left; }
.ctx > :first-child { border-left: 0; }
.ctx > button:hover { background: var(--pri-tint); } .ctx > button span { color: var(--pri); }
.ctx span { font-size: 11px; color: var(--fg3); } .ctx b { font-size: 13px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.wsteps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ws { display: flex; gap: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.ws .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--n-bg); color: var(--fg3); flex: none; }
.ws.on { border-color: var(--pri); box-shadow: 0 0 0 2px var(--pri-tint); }
.ws.on .n { background: var(--pri); color: #fff; }
.ws.done .n { background: var(--g-bg); color: var(--g); }
.ws.lock { opacity: .6; }
.ws .wb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.ws .wb textarea, .ws .wb .row { align-self: stretch; }
.ws .wt { font-weight: 700; }
.ws textarea { width: 100%; min-height: 54px; border: 1px solid var(--line2); border-radius: 4px; padding: 8px 10px; resize: vertical; }
.note.ok { background: var(--g-bg); } .note.ok b { color: var(--g); }
.note input { border: 1px solid var(--line2); border-radius: 4px; padding: 5px 8px; width: 140px; }
.intro h2 { margin: 0; font-size: 20px; }
.facts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.facts li { background: var(--label); border-radius: 6px; padding: 10px 14px; }
.facts li > b:first-child { display: block; margin-bottom: 2px; }
.intro-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.intro-btns .btn { white-space: normal; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.intro-btns small { font-weight: 400; opacity: .85; font-size: 12px; }
.admin { display: flex; gap: 10px; align-items: center; border: 1px dashed var(--r-line); border-radius: 6px; padding: 6px 12px; }
@media (max-width: 1100px) { .hero-row { grid-template-columns: minmax(0, 1fr); } .ctx { grid-template-columns: repeat(2, minmax(0, 1fr)); } .intro-btns { grid-template-columns: 1fr; } .hero-main { flex-direction: column; align-items: stretch; } }

/* 체험 모드 */
.trialbar { display: flex; gap: 10px; align-items: center; background: #FFF4D6; border-bottom: 1px solid #F2C677; color: #6B4A00; padding: 6px 24px; font-size: 13px; }
.note.trial { background: #FFF4D6; } .note.trial b { color: #6B4A00; }
.hero .ids { font-size: 11px; color: var(--fg3); margin-top: 2px; }
.hero-s b { color: var(--fg); }
/* 쉬운 화면: ① 공장 → ② 문제 처리 → ③ 결과, 세 칸을 왼쪽에서 오른쪽으로 */
.app:has(> .easy) { display: block; background: var(--bg); }
.easy { min-height: 100vh; display: flex; flex-direction: column; }
.etop { display: flex; gap: 12px; align-items: center; padding: 12px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
.logo2 { color: var(--pri); font-size: 18px; }
.eflow { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px; padding: 20px 24px; align-items: stretch; }
.arr { align-self: center; font-style: normal; font-size: 30px; color: var(--fg3); }
.ecol { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.eh { display: flex; align-items: center; gap: 10px; }
.eh h2 { margin: 0; font-size: 20px; }
.eh .num { width: 30px; height: 30px; border-radius: 50%; background: var(--pri); color: #fff; display: grid; place-items: center; font-weight: 700; }
.lead { margin: 0; color: var(--fg2); font-size: 13.5px; }
.hint2 { margin: 0; color: var(--fg3); font-size: 12.5px; }
.ebtn .btn.big { width: 100%; font-size: 16px; padding: 12px 18px; }
.elist, .esteps, .ebars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.es { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-left: 4px solid var(--n); border-radius: 6px; background: var(--label); }
.es .n { width: 22px; color: var(--fg3); }
.es .l1 small { color: var(--fg3); }
.es .l2 { display: flex; gap: 8px; align-items: center; margin-top: 3px; }
.es .w { font-size: 12.5px; font-weight: 700; min-width: 104px; }
.eb { flex: 1; display: block; height: 9px; background: var(--line); border-radius: 5px; overflow: hidden; }
.eb em { display: block; height: 100%; background: var(--n); border-radius: 5px; transition: width .6s; }
.es.g { border-left-color: var(--g); } .es.g .w { color: var(--g); } .es.g .eb em, .eb.g em { background: var(--g); }
.es.r { border-left-color: var(--r); background: var(--r-bg); } .es.r .w { color: var(--r); } .es.r .eb em, .eb.r em { background: var(--r); }
.es.o { border-left-color: var(--o); background: var(--o-bg); } .es.o .w { color: var(--o); } .es.o .eb em, .eb.o em { background: var(--o); }
.es.b { border-left-color: var(--b); } .es.b .w { color: var(--b); } .es.b .eb em, .eb.b em { background: var(--b); }
.elist.live .es.g .eb em { background-image: linear-gradient(45deg, rgba(255,255,255,.5) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.5) 50%, rgba(255,255,255,.5) 75%, transparent 75%); background-size: 12px 12px; animation: tpStripe .8s linear infinite; }
.es.r { animation: tpBlink 1.6s ease-in-out infinite; }
@keyframes tpBlink { 50% { background: #FBD5D1; } }
.eclock { font-size: 15px; } .eclock small { color: var(--fg3); }
.eprob { padding: 12px 14px; border-radius: 8px; font-size: 16px; font-weight: 700; }
.eprob small { display: block; font-size: 12.5px; font-weight: 400; color: var(--fg2); margin-top: 2px; }
.eprob.bad { background: var(--r-bg); color: var(--r); } .eprob.ok { background: var(--g-bg); color: var(--g); }
.esteps li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; opacity: .55; }
.esteps li small { display: block; color: var(--fg2); font-size: 12.5px; }
.esteps li .n { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line2); display: grid; place-items: center; font-size: 13px; }
.esteps li.on { opacity: 1; background: var(--pri-tint); } .esteps li.on .n { border-color: var(--pri); color: var(--pri); }
.esteps li.done { opacity: 1; } .esteps li.done .n { background: var(--g); border-color: var(--g); color: #fff; }
.eok { color: var(--g); font-size: 18px; font-weight: 700; }
.ebars li { display: grid; grid-template-columns: 112px minmax(0, 1fr) 64px; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 6px; }
.ebars li b { text-align: right; font-size: 18px; }
.ebars li.chg { background: var(--o-bg); outline: 2px solid var(--o); }
.echg { min-height: 40px; padding: 8px 10px; border-radius: 6px; background: var(--label); }
.echg small { color: var(--fg3); }
@media (max-width: 1000px) { .eflow { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; } .arr { justify-self: center; transform: rotate(90deg); } .etop { flex-wrap: wrap; padding: 10px 16px; } }
@media (prefers-reduced-motion: reduce) { .elist.live .es.g .eb em, .es.r { animation: none; } }
.etop .grow, .es > .grow { flex: 1; min-width: 0; }
.es .l2 .eb { flex: 1 1 auto; min-width: 80px; }
.eflow { align-items: start; }
/* 3D 확장 데모 */
.t3page { height: 100vh; }
.t3main { position: relative; flex: 1; min-height: 520px; }
#t3host, .t3wrap { position: absolute; inset: 0; }
.t3wrap canvas { display: block; width: 100%; height: 100%; }
.t3labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.t3lab { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; flex-direction: column; gap: 3px; min-width: 112px; padding: 6px 10px; border-radius: 8px; border: 0; border-left: 5px solid var(--n); background: rgba(255,255,255,.92); box-shadow: 0 2px 8px rgba(0,0,0,.18); text-align: left; font-size: 12px; }
.t3lab b { font-size: 13px; } .t3lab span { font-weight: 700; }
.t3lab i { display: block; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; } .t3lab i em { display: block; height: 100%; background: currentColor; }
.t3lab.g { border-left-color: var(--g); color: var(--g); } .t3lab.r { border-left-color: var(--r); color: var(--r); background: #FFF1EF; } .t3lab.o { border-left-color: var(--o); color: var(--o); } .t3lab.b { border-left-color: var(--b); color: var(--b); } .t3lab.n { color: var(--fg3); }
.t3lab b { color: var(--fg); } .t3lab.sel { outline: 3px solid var(--pri); }
.t3lab.r { animation: tpBlink 1.6s ease-in-out infinite; }
.t3panel { position: absolute; left: 16px; top: 16px; width: 300px; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: rgba(255,255,255,.94); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
.t3legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; } .t3legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.t3prob { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 8px; font-size: 14px; }
.t3prob.bad { background: var(--r-bg); color: var(--r); } .t3prob.ok { background: var(--g-bg); color: var(--g); }
.t3prob .btn.big { width: 100%; }
.t3dots { display: flex; flex-wrap: wrap; gap: 4px; font-size: 11.5px; color: var(--fg2); } .t3dots span { padding: 2px 6px; border-radius: 10px; background: rgba(255,255,255,.7); }
.t3dots span.done { color: var(--g); font-weight: 700; } .t3dots span.on { background: var(--pri); color: #fff; }
.t3info { position: absolute; right: 16px; top: 16px; width: 260px; padding: 12px 14px; background: rgba(255,255,255,.95); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: flex; flex-direction: column; gap: 6px; }
.t3info .ph { display: flex; gap: 8px; align-items: baseline; } .t3info .grow { flex: 1; }
.t3row { display: flex; justify-content: space-between; font-size: 13px; } .t3row span { color: var(--fg3); }
.c-g { color: var(--g); } .c-r { color: var(--r); } .c-o { color: var(--o); } .c-b { color: var(--b); } .c-n { color: var(--fg3); }
.t3msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 16px 22px; background: rgba(255,255,255,.95); border-radius: 10px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.t3msg small { color: var(--fg3); }
.eh .grow { flex: 1; }
@media (max-width: 1000px) { .t3panel { position: static; width: auto; margin: 10px; } .t3main { display: flex; flex-direction: column-reverse; } #t3host { position: relative; height: 60vh; } .t3info { position: static; width: auto; margin: 10px; } }
/* 블록 제조 화면(어두운 테마) */
.app:has(> .bk) { display: block; background: #0f141c; }
.bk { --k0: #0f141c; --k1: #161d28; --k2: #1d2633; --k3: #27324291; --kl: #2b3646; --kt: #e6edf5; --kt2: #9fb0c3; --kb: #3b82f6; --kg: #22c55e;
  height: 100vh; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 10px; padding: 0 12px 12px; background: var(--k0); color: var(--kt); }
.bk button, .bk select, .bk input { color: inherit; }
.bktop { display: flex; align-items: center; gap: 14px; height: 54px; border-bottom: 1px solid var(--kl); margin: 0 -12px; padding: 0 16px; background: #121925; }
.bklogo { font-size: 18px; letter-spacing: .5px; } .bktop small { color: var(--kt2); margin-left: -8px; }
.bktop nav { display: flex; gap: 4px; margin-left: 16px; } .bktop nav button { background: none; border: 0; padding: 8px 12px; border-radius: 6px; color: var(--kt2); }
.bktop nav button.on { background: #1e3a66; color: #fff; } .bktop nav button:hover { color: #fff; }
.bktop .grow { flex: 1; } .bktop select { background: var(--k2); border: 1px solid var(--kl); border-radius: 6px; padding: 6px 10px; }
.bkchip { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--k2); color: var(--kt2); border: 1px solid var(--kl); }
.bkchip.g { color: var(--kg); border-color: #1f6b3d; background: #10291b; } .bkchip.b { color: #93c5fd; border-color: #1e4f99; background: #10213d; }
.bkchip.r { color: #fca5a5; border-color: #7f1d1d; background: #2a1212; } .bkchip.warn { color: #fbbf24; border-color: #7a5a12; background: #2a2010; }
.bkcards { display: flex; align-items: stretch; gap: 6px; }
.bkcard { flex: 1; min-width: 0; background: var(--k1); border: 1px solid var(--kl); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.bkcard.done { border-color: #1f6b3d; } .bkcard.on { border-color: var(--kb); box-shadow: 0 0 0 1px var(--kb) inset; }
.bkct { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .bkct b { color: #93c5fd; }
.bkthumb { position: relative; height: 64px; border-radius: 5px; background: #222 center/cover no-repeat; } .bkthumb .bkchip { position: absolute; left: 6px; bottom: 6px; }

window.TP_GLB_V = '4103d7b0';
// TWIN PRO 화면 모델 — 서버(Supabase) 테이블을 읽어 화면 계산에 쓰는 읽기 전용 상태 S를 만든다.
// 상태를 바꾸는 규칙(R1~R7)은 전부 서버 함수(sql/02_functions.sql)에 있다. 여기에는 계산만 있다.
const AI_LIMIT = 5;
const BASE = '2026-09-16 12:00', DAY = '2026-09-16', OP_START = '2026-09-07 08:00', SHIFT_END = '2026-09-16 16:00';
const toM = s => { const [d, t] = s.split(' '); const [Y, M, D] = d.split('-').map(Number); const [h, m] = t.split(':').map(Number); return Date.UTC(Y, M - 1, D, h, m) / 60000; };
const p2 = n => String(n).padStart(2, '0');
const fromM = m => { const d = new Date(m * 60000); return `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; };
const hm = s => s ? s.slice(11, 16) : '';
const md = s => s ? s.slice(5, 10).replace('-', '/') : '';
const ts = v => v == null ? null : String(v).replace('T', ' ').slice(0, 16);          // DB 시각 → 'YYYY-MM-DD HH:MM'
const num = v => v == null ? null : Number(v);
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const wd = s => WD[new Date(toM(s.slice(0, 10) + ' 00:00') * 60000).getUTCDay()];

const STATUS = {
  eq: { RUNNING: ['가동', 'g'], IDLE: ['대기', 'o'], FAULT: ['고장', 'r'], MAINTENANCE: ['점검', 'p'], OFFSHIFT: ['비운영', 'n'] },
  wo: { PLANNED: ['계획', 'n'], IN_PROGRESS: ['진행', 'b'], BLOCKED: ['보류', 'r'], COMPLETED: ['완료', 'g'] },
  inc: { OPEN: ['미해소', 'r'], RESOLVED: ['해소', 'g'] },
  cat: { EQUIPMENT: ['설비 고장', 'r'], MATERIAL: ['자재 대기', 'o'], QUALITY: ['품질 보류', 'r'] },
  his: { START: '시작', PAUSE: '중단', RESUME: '재개', COMPLETE: '완료', QUALITY_HOLD: '품질 보류', REWORK_DONE: '보수 완료', ACTION: '조치', RESOLVE: '해소', PROGRESS: '실적', REASSIGN: '설비 변경' },
};
const CAT_ORDER = { EQUIPMENT: 0, MATERIAL: 1, QUALITY: 2 };
const unit = u => (u === 'm2' ? 'm²' : u);
let S = null;

// rows: { processes:[...], equipment:[...], ... } (테이블명에서 tp_ 를 뺀 이름)
function buildState(rows) {
  const st = { now: toM(ts(rows.sim_clock[0].now)), processes: {}, zones: {}, equipment: {}, wo: {}, blocks: {}, vessels: {}, counts: {} };
  for (const [k, v] of Object.entries(rows)) st.counts[k] = v.length;
  const byId = (arr, k) => arr.slice().sort((a, b) => String(a[k]).localeCompare(String(b[k])));
  byId(rows.processes, 'process_id').forEach(p => st.processes[p.process_id] = { ...p, standard_hours: num(p.standard_hours) });
  rows.zones.forEach(z => st.zones[z.zone_id] = z);
  rows.vessels.forEach(v => st.vessels[v.vessel_id] = v);
  byId(rows.blocks, 'block_id').forEach(b => st.blocks[b.block_id] = { ...b, weight_t: num(b.weight_t), target_transfer_at: ts(b.target_transfer_at) });
  byId(rows.equipment, 'equipment_id').forEach(e => st.equipment[e.equipment_id] = { ...e });
  byId(rows.work_orders, 'work_order_id').forEach(w => st.wo[w.work_order_id] = {
    ...w, planned_start_at: ts(w.planned_start_at), planned_end_at: ts(w.planned_end_at), actual_start_at: ts(w.actual_start_at), actual_end_at: ts(w.actual_end_at),
    forecast_end_at: ts(w.forecast_end_at), planned_qty: num(w.planned_qty), accepted_qty: num(w.accepted_qty), progress_ratio: num(w.progress_ratio),
  });
  const acts = {};
  rows.incident_actions.slice().sort((a, b) => a.id - b.id).forEach(a => (acts[a.incident_id] ||= []).push({ at: ts(a.at), note: a.note, owner: a.owner }));
  st.incidents = rows.incidents.map(i => ({ ...i, opened_at: ts(i.opened_at), resolved_at: ts(i.resolved_at), actions: acts[i.incident_id] || [] }));
  st.history = rows.work_history.map(h => ({ ...h, event_at: ts(h.event_at) })).sort((a, b) => toM(a.event_at) - toM(b.event_at) || a.history_id.localeCompare(b.history_id));
  st.intervals = rows.equipment_intervals.map(i => ({ id: i.interval_id, eq: i.equipment_id, s: toM(ts(i.start_at)), e: i.end_at ? toM(ts(i.end_at)) : null, status: i.status, wo: i.work_order_id, inc: i.incident_id }));
  st.inspections = rows.inspections.slice().sort((a, b) => a.inspection_id.localeCompare(b.inspection_id));
  st.actuals = rows.production_actual; st.plan = rows.production_plan; st.rework = rows.rework; st.status_codes = rows.status_codes;
  st.events = rows.event_log.slice().sort((a, b) => b.id - a.id).map(e => ({ at: ts(e.at), text: e.text }));
  const ai = (rows.ai_summary || []).slice().sort((a, b) => b.id - a.id)[0];
  st.ai = ai ? { sim_at: ts(ai.sim_at), text: ai.text, model: ai.model } : null;
  const today = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);       // 한국 날짜
  st.aiUsed = num((rows.ai_usage || []).find(u => String(u.day).slice(0, 10) === today)?.used) || 0;
  st.simLock = (rows.sim_lock || [])[0] || null;
  st.signals = (rows.signal_log || []).slice().sort((a, b) => b.id - a.id).slice(0, 8).map(g => ({ ...g, sim_at: ts(g.sim_at), value: num(g.value) }));
  return st;
}

const nowS = () => fromM(S.now);
const proc = id => S.processes[id];
const eqOf = id => S.equipment[id];
const woList = () => Object.values(S.wo);
const incById = id => S.incidents.find(i => i.incident_id === id);
const openIncidents = () => S.incidents.filter(i => i.status === 'OPEN').sort((a, b) => CAT_ORDER[a.category] - CAT_ORDER[b.category] || toM(a.opened_at) - toM(b.opened_at));

// 파일의 각 행 = 작업지시 + 누적 인정수량. 화면은 미리 확인만 하고, 반영 여부는 서버 규칙(R6)이 한 트랜잭션으로 판단한다.
function importCheck(r) {
  const w = S.wo[r.wo];
  if (!w) return ['err', '없는 작업지시'];
  if (!/^\s*\d+(\.\d+)?\s*$/.test(r.qty)) return ['err', '수량이 숫자가 아님'];
  const q = Number(r.qty);
  if (w.status !== 'IN_PROGRESS') return ['warn', `${STATUS.wo[w.status][0]} 상태 → 서버 거부 예상`];
  if (q > w.planned_qty) return ['warn', '계획수량 초과 → 서버 거부 예상'];
  if (q < w.accepted_qty) return ['warn', '현재보다 감소 → 서버 거부 예상'];
  return ['ok', q === w.planned_qty ? '반영 시 완료 처리' : `+${+(q - w.accepted_qty).toFixed(1)} ${unit(w.unit)}`];
}

  const rows = UI.imp.rows || [];

  const body = rows.map((r, n) => { const w = S.wo[r.wo], [k, m] = chk[n];
    return `<tr><td class="c">${n + 1}</td><td>${esc(r.wo)}</td><td class="num">${esc(r.qty)}</td><td class="num">${w ? `${w.accepted_qty} / ${w.planned_qty} ${unit(w.unit)}` : '-'}</td><td class="c">${w ? badge('wo', w.status) : '-'}</td>

function parseCsv(text) {
  const out = []; let row = [], cur = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ',' || c === '\t') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += c; }
  if (cur !== '' || row.length) { row.push(cur); out.push(row); }
  return out.filter(r => r.some(v => v.trim() !== ''));
}
function importRows(table) {
  const h = (table[0] || []).map(x => x.trim().toLowerCase());
  const iw = h.findIndex(x => /작업지시|work_order/.test(x)), iq = h.findIndex(x => /인정수량|accepted_qty/.test(x));
  if (iw < 0 || iq < 0) throw new Error('첫 줄에 "작업지시"와 "인정수량" 열이 있어야 합니다.');
  return table.slice(1).map(r => ({ wo: (r[iw] || '').trim(), qty: (r[iq] || '').trim() }));
}

async function readImportFile(f) {
