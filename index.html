<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TWIN PRO 운영 모니터링</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>/* Layout: 왼쪽 220px 남색 사이드바 + 상단 상태칩 헤더 + 탭 + 흰 콘텐츠 카드(패널 그리드). 01H Figma 확정안과 같은 단일 라이트 테마(관제 화면 고정 톤). */
:root {
  --side: #002554; --side-hi: rgba(255,255,255,.12); --side-fg: #DCE6F5; --side-dim: #9DB3D6;
  --pri: #003087; --pri-tint: #E8EEF8; --bg: #F2F4F7; --card: #FFFFFF; --label: #F3F5F8; --row-hi: #EAF0F8;
  --fg: #1B2433; --fg2: #535D6C; --fg3: #6B7584; --line: #E1E5EB; --line2: #D8DEE6;
  --g: #008233; --g-bg: #E3F3E8; --o: #C76F00; --o-bg: #FFF3DF; --r: #D63B32; --r-bg: #FDECEA; --r-line: #F1A7A1;
  --p: #7353CF; --p-bg: #F0EBFC; --b: #2B74DE; --b-bg: #E7F0FD; --n: #6B7280; --n-bg: #F0F1F3; --icon: #2E3F57;
  --P01: #0EA5E9; --P02: #6366F1; --P03: #F97316; --P04: #06B6D4; --P05: #EC4899; --P06: #EAB308;
  --font: 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pri); outline-offset: 1px; }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; background: linear-gradient(to right, var(--side) 220px, var(--bg) 220px); }
/* sidebar */
.side { background: var(--side); color: var(--side-fg); padding: 18px 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
.logo { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
.logo b { width: 30px; height: 30px; border-radius: 6px; background: #6E9BE0; color: #fff; display: grid; place-items: center; font-size: 12px; }
.logo strong { display: block; font-size: 15px; color: #fff; letter-spacing: .02em; }
.logo small { font-size: 11px; color: var(--side-dim); }
.side h6 { margin: 12px 0 2px; font-size: 11px; font-weight: 500; color: var(--side-dim); }
.nav { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--side-fg); padding: 9px 12px; border-radius: 4px; }
.nav::before { content: '•'; margin-right: 8px; opacity: .6; }
.nav.on { background: var(--side-hi); color: #fff; font-weight: 700; }
.side .databox { margin-top: auto; background: rgba(255,255,255,.08); border-radius: 6px; padding: 12px; font-size: 11px; color: var(--side-dim); }
.databox b { display: block; color: #fff; font-size: 13px; margin: 2px 0; }
/* header */
.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 24px; flex-wrap: wrap; background: var(--card); }
.chip { border-radius: 999px; padding: 4px 12px; font-size: 12px; border: 1px solid transparent; background: var(--pri-tint); color: var(--pri); }
.chip.warn { background: var(--o-bg); color: var(--o); border-color: #F2C677; }
.chip.alert { background: var(--r-bg); color: var(--r); border: 0; }
.chip.alert::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--r); margin-right: 6px; }
.clock { display: inline-flex; align-items: center; gap: 4px; }
.btn { border: 1px solid var(--line2); background: var(--card); border-radius: 4px; padding: 5px 12px; font-size: 12px; white-space: nowrap; }
.btn.pri { background: var(--pri); color: #fff; border-color: var(--pri); font-weight: 600; }
.btn.line { border-color: var(--pri); color: var(--pri); }
.btn.danger { border-color: var(--r-line); color: var(--r); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.tabs { display: flex; gap: 4px; padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 1px solid var(--line); border-bottom: 0; background: var(--card); padding: 8px 16px; border-radius: 6px 6px 0 0; color: var(--fg2); white-space: nowrap; }
.tab.on { background: var(--pri); color: #fff; border-color: var(--pri); font-weight: 700; }
.content { margin: 16px 24px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ptitle { display: flex; justify-content: space-between; align-items: center; }
.ptitle h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
.ptitle h1::before { content: ''; width: 12px; height: 12px; border: 2px solid var(--pri); box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 6px var(--pri); }
.crumb { color: var(--fg3); font-size: 12px; }
/* panels */
.grid { display: grid; gap: 16px; min-width: 0; }
.g-dash { grid-template-columns: minmax(0, 1fr) minmax(340px, 0.37fr); }
.g-eq { grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr); }
.g-prod { grid-template-columns: minmax(0, 1fr) minmax(380px, 0.45fr); }
.g-wo { grid-template-columns: minmax(0, 1fr) minmax(440px, 0.55fr); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.panel { border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; gap: 12px; background: var(--card); }
.ph { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ph h2 { margin: 0; font-size: 15px; padding-left: 9px; border-left: 3px solid var(--pri); }
.ph .sub { color: var(--fg3); font-size: 12px; }
.ph .grow { flex: 1; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.g { color: var(--g); background: var(--g-bg); } .badge.o { color: var(--o); background: var(--o-bg); }
.badge.r { color: var(--r); background: var(--r-bg); } .badge.p { color: var(--p); background: var(--p-bg); }
.badge.b { color: var(--b); background: var(--b-bg); } .badge.n { color: var(--n); background: var(--n-bg); }
.badge.delay { color: var(--r); background: var(--card); border: 1px solid var(--r); }
/* KPI */
.kpis { display: grid; grid-template-columns: repeat(5, 1fr) 1.35fr 1.35fr 1.35fr; border: 1px solid var(--line); border-radius: 6px; }
.kpi { padding: 14px 18px; border-left: 1px solid var(--line); }
.kpi:first-child { border-left: 0; }
.kpi span { font-size: 12px; color: var(--fg2); }
.kpi b { display: block; font-size: 28px; line-height: 1.2; }
.kpi b small { font-size: 12px; color: var(--fg3); font-weight: 400; margin-left: 4px; }
.c-g { color: var(--g); } .c-o { color: var(--o); } .c-r { color: var(--r); } .c-p { color: var(--p); } .c-b { color: var(--b); }
/* table */
.tw { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; }
th { background: var(--label); color: var(--fg2); font-weight: 500; text-align: left; padding: 9px 10px; font-size: 12px; white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr.sel td { background: var(--row-hi); }
tbody tr[data-act] { cursor: pointer; }
tbody tr[data-act]:hover td { background: #F6F8FB; }
tbody tr.sel[data-act]:hover td { background: var(--row-hi); }
td.num, th.num { text-align: right; }
td.c, th.c { text-align: center; }
.small { font-size: 11px; color: var(--fg3); }
.warn-t { color: var(--r); font-size: 12px; }
.bar { display: inline-flex; align-items: center; gap: 8px; }
.bar i { width: 80px; height: 5px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; display: inline-block; }
.bar i em { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.bar small { color: var(--fg2); font-size: 12px; min-width: 42px; }
/* flow */
.flow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.step { border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 5px; position: relative; text-align: left; background: var(--card); min-width: 0; }
.step.fault { border-color: var(--r-line); background: #FFF8F7; }
.step + .step::before { content: '›'; position: absolute; left: -10px; top: 45%; color: var(--fg3); }
.step .t { font-weight: 700; font-size: 13px; } .step .t small { color: var(--fg3); font-weight: 400; margin-right: 4px; }
.ico { color: var(--icon); display: grid; place-items: center; height: 92px; }
.ico svg { height: 76px; max-width: 100%; }
.step .blk { color: var(--pri); font-weight: 700; }
.step .eqn { font-size: 11px; color: var(--fg3); }
.legend { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--fg2); }
/* lists */
.chk { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.chk .grow { flex: 1; min-width: 0; }
.chk .l1 { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.chk .l2 { font-size: 12px; color: var(--fg3); margin-top: 2px; }
/* search box */
.search { display: flex; gap: 12px; flex-wrap: wrap; background: var(--label); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; align-items: center; }
.field { display: flex; border: 1px solid var(--line2); border-radius: 4px; background: var(--card); overflow: hidden; min-height: 34px; }
.field > label, .field > span.lb { background: var(--label); color: var(--fg2); padding: 7px 12px; min-width: 90px; border-right: 1px solid var(--line2); }
.field > .in { display: flex; align-items: center; gap: 10px; padding: 0 10px; }
.field input[type=text], .field input[type=number], .field select { border: 0; background: transparent; padding: 6px 2px; min-width: 120px; outline: none; }
.radios { display: inline-flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.radios label { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.radios input { accent-color: var(--pri); margin: 0; }
/* form */
.form { border: 1px solid var(--line); border-radius: 4px; }
.frow { display: grid; grid-template-columns: 120px minmax(0, 1fr); border-bottom: 1px solid var(--line); }
.frow:last-child { border-bottom: 0; }
.frow > span { background: var(--label); color: var(--fg2); padding: 10px 12px; }
.frow > div { padding: 6px 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.frow input, .frow select, .frow textarea { border: 1px solid var(--line2); border-radius: 4px; padding: 6px 10px; background: var(--card); width: 100%; }
.frow input[readonly] { background: var(--label); color: var(--fg3); }
.req::after { content: ' *'; color: var(--r); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; width: 100%; }
.seg button { border: 0; background: var(--card); padding: 7px 0; border-left: 1px solid var(--line2); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--pri); color: #fff; font-weight: 700; }
.note { background: var(--pri-tint); border-radius: 6px; padding: 10px 14px; font-size: 12px; color: var(--fg2); }
.note b { color: var(--pri); display: block; margin-bottom: 2px; }
.alertbox { border: 1px solid var(--r-line); background: #FFF8F7; border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.alertbox textarea { width: 100%; min-height: 64px; border: 1px solid var(--line2); border-radius: 4px; padding: 8px 10px; resize: vertical; background: var(--card); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .grow { flex: 1; }
.info { display: grid; grid-template-columns: 96px 1fr 96px 1fr; border: 1px solid var(--line); border-radius: 4px; }
.info > * { padding: 8px 10px; border-bottom: 1px solid var(--line); min-width: 0; }
.info > span { background: var(--label); color: var(--fg2); font-size: 12px; }
.info > :nth-last-child(-n+4) { border-bottom: 0; }
.det-top { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; }
.det-ico { border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; color: var(--icon); }
.det-ico svg { height: 110px; max-width: 80%; }
/* timeline */
.tl { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 12px; color: var(--fg2); }
.tl .lane { position: relative; height: 22px; background: var(--n-bg); border-radius: 2px; overflow: hidden; }
.tl .lane i { position: absolute; top: 0; bottom: 0; }
.tl .axis { position: relative; height: 16px; font-size: 11px; color: var(--fg3); }
.tl .axis span { position: absolute; transform: translateX(-50%); }
.tl .axis span:first-child { transform: none; } .tl .axis span:last-child { transform: translateX(-100%); }
/* stage cells */
.stages { display: inline-flex; gap: 3px; }
.stages i { width: 15px; height: 7px; border-radius: 2px; background: var(--line); display: inline-block; }
.stages i.cur { background: var(--card); border: 1.5px solid; }
.pa { display: flex; flex-direction: column; gap: 4px; }
.pa .h { display: flex; justify-content: space-between; font-size: 12px; }
.pa .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.pa .track em { display: block; height: 100%; border-radius: 3px; }
.pager { display: flex; justify-content: center; gap: 6px; }
.pager button { min-width: 28px; border: 1px solid var(--line2); background: var(--card); border-radius: 4px; padding: 3px 6px; }
.pager button.on { background: var(--pri); color: #fff; border-color: var(--pri); }
.subtabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); }
.subtabs button { border: 0; background: none; padding: 6px 0 8px; font-size: 15px; color: var(--fg3); border-bottom: 2px solid transparent; }
.subtabs button.on { color: var(--fg); font-weight: 700; border-color: var(--pri); }
.subtabs small { background: var(--pri-tint); color: var(--pri); border-radius: 999px; padding: 0 7px; font-size: 11px; margin-left: 6px; }
.toggle { width: 36px; height: 20px; border-radius: 10px; background: var(--pri); position: relative; display: inline-block; }
.toggle::after { content: ''; position: absolute; right: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
.toggle.off { background: var(--line2); } .toggle.off::after { right: auto; left: 3px; }
.sw { width: 22px; height: 10px; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 6px; }
.links { display: flex; gap: 6px; flex-wrap: wrap; }
.events { font-size: 12px; color: var(--fg2); max-height: 120px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.clip { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--fg3); padding: 18px; text-align: center; border: 1px dashed var(--line2); border-radius: 6px; }
.toast { position: fixed; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 460px; background: var(--fg); color: #fff; padding: 12px 16px; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.18); font-size: 13px; z-index: 10; }
.toast.ng { background: var(--r); }
.blank-gap { flex: 1; }
@media (max-width: 1280px) {
  .kpis { grid-template-columns: repeat(4, 1fr); } .kpi:nth-child(5) { border-left: 0; } .kpi:nth-child(n+5) { border-top: 1px solid var(--line); }
  .flow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .step:nth-child(3n+1)::before { content: none; }
}
@media (max-width: 1500px) { .g-eq { grid-template-columns: minmax(0, 1fr); } .g-eq > .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 1100px) {
  .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .app { grid-template-columns: 1fr; background: var(--bg); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; }
  .side h6, .side .databox { display: none; } .logo { margin: 0 12px 0 0; }
  .nav { width: auto; }
  .grid { grid-template-columns: minmax(0, 1fr) !important; }
  .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .content { margin: 12px 16px 16px; padding: 14px 16px; }
  .top, .tabs { padding-inline: 16px; }
}
@media (max-width: 640px) {
  .g-4 { grid-template-columns: minmax(0, 1fr) !important; }
  .kpis { grid-template-columns: repeat(2, 1fr); } .kpi { border-left: 0; border-top: 1px solid var(--line); }
  .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } .step::before { content: none !important; }
  .det-top { grid-template-columns: 1fr; } .info { grid-template-columns: 90px 1fr; } .info > :nth-last-child(-n+4) { border-bottom: 1px solid var(--line); }
  .field { flex-wrap: wrap; } .field input[type=text] { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style></head>

// TWIN PRO 화면 모델 — 서버(Supabase) 테이블을 읽어 화면 계산에 쓰는 읽기 전용 상태 S를 만든다.
// 상태를 바꾸는 규칙(R1~R7)은 전부 서버 함수(sql/02_functions.sql)에 있다. 여기에는 계산만 있다.
const BASE = '2026-09-16 12:00', DAY = '2026-09-16', OP_START = '2026-09-07 08:00', SHIFT_END = '2026-09-16 16:00';
const toM = s => { const [d, t] = s.split(' '); const [Y, M, D] = d.split('-').map(Number); const [h, m] = t.split(':').map(Number); return Date.UTC(Y, M - 1, D, h, m) / 60000; };
const p2 = n => String(n).padStart(2, '0');
const fromM = m => { const d = new Date(m * 60000); return `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; };
const hm = s => s ? s.slice(11, 16) : '';
const md = s => s ? s.slice(5, 10).replace('-', '/') : '';
const ts = v => v == null ? null : String(v).replace('T', ' ').slice(0, 16);          // DB 시각 → 'YYYY-MM-DD HH:MM'
const num = v => v == null ? null : Number(v);
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const wd = s => WD[new Date(toM(s.slice(0, 10) + ' 00:00') * 60000).getUTCDay()];

const STATUS = {
  eq: { RUNNING: ['가동', 'g'], IDLE: ['대기', 'o'], FAULT: ['고장', 'r'], MAINTENANCE: ['점검', 'p'], OFFSHIFT: ['비운영', 'n'] },
  wo: { PLANNED: ['계획', 'n'], IN_PROGRESS: ['진행', 'b'], BLOCKED: ['보류', 'r'], COMPLETED: ['완료', 'g'] },
  inc: { OPEN: ['미해소', 'r'], RESOLVED: ['해소', 'g'] },
  cat: { EQUIPMENT: ['설비 고장', 'r'], MATERIAL: ['자재 대기', 'o'], QUALITY: ['품질 보류', 'r'] },
  his: { START: '시작', PAUSE: '중단', RESUME: '재개', COMPLETE: '완료', QUALITY_HOLD: '품질 보류', REWORK_DONE: '보수 완료', ACTION: '조치', RESOLVE: '해소', PROGRESS: '실적', REASSIGN: '설비 변경' },
};
const CAT_ORDER = { EQUIPMENT: 0, MATERIAL: 1, QUALITY: 2 };
const unit = u => (u === 'm2' ? 'm²' : u);
let S = null;

// rows: { processes:[...], equipment:[...], ... } (테이블명에서 tp_ 를 뺀 이름)
function buildState(rows) {
  const st = { now: toM(ts(rows.sim_clock[0].now)), processes: {}, zones: {}, equipment: {}, wo: {}, blocks: {}, vessels: {}, counts: {} };
  for (const [k, v] of Object.entries(rows)) st.counts[k] = v.length;
  const byId = (arr, k) => arr.slice().sort((a, b) => String(a[k]).localeCompare(String(b[k])));
  byId(rows.processes, 'process_id').forEach(p => st.processes[p.process_id] = { ...p, standard_hours: num(p.standard_hours) });
  rows.zones.forEach(z => st.zones[z.zone_id] = z);
  rows.vessels.forEach(v => st.vessels[v.vessel_id] = v);
  byId(rows.blocks, 'block_id').forEach(b => st.blocks[b.block_id] = { ...b, weight_t: num(b.weight_t), target_transfer_at: ts(b.target_transfer_at) });
  byId(rows.equipment, 'equipment_id').forEach(e => st.equipment[e.equipment_id] = { ...e });
  byId(rows.work_orders, 'work_order_id').forEach(w => st.wo[w.work_order_id] = {
    ...w, planned_start_at: ts(w.planned_start_at), planned_end_at: ts(w.planned_end_at), actual_start_at: ts(w.actual_start_at), actual_end_at: ts(w.actual_end_at),
    forecast_end_at: ts(w.forecast_end_at), planned_qty: num(w.planned_qty), accepted_qty: num(w.accepted_qty), progress_ratio: num(w.progress_ratio),
  });
  const acts = {};
  rows.incident_actions.slice().sort((a, b) => a.id - b.id).forEach(a => (acts[a.incident_id] ||= []).push({ at: ts(a.at), note: a.note, owner: a.owner }));
  st.incidents = rows.incidents.map(i => ({ ...i, opened_at: ts(i.opened_at), resolved_at: ts(i.resolved_at), actions: acts[i.incident_id] || [] }));
  st.history = rows.work_history.map(h => ({ ...h, event_at: ts(h.event_at) })).sort((a, b) => toM(a.event_at) - toM(b.event_at) || a.history_id.localeCompare(b.history_id));
  st.intervals = rows.equipment_intervals.map(i => ({ id: i.interval_id, eq: i.equipment_id, s: toM(ts(i.start_at)), e: i.end_at ? toM(ts(i.end_at)) : null, status: i.status, wo: i.work_order_id, inc: i.incident_id }));
  st.inspections = rows.inspections.slice().sort((a, b) => a.inspection_id.localeCompare(b.inspection_id));
  st.actuals = rows.production_actual; st.plan = rows.production_plan; st.rework = rows.rework; st.status_codes = rows.status_codes;
  st.events = rows.event_log.slice().sort((a, b) => b.id - a.id).map(e => ({ at: ts(e.at), text: e.text }));
  return st;
}

const nowS = () => fromM(S.now);
const proc = id => S.processes[id];
const eqOf = id => S.equipment[id];
const woList = () => Object.values(S.wo);
const incById = id => S.incidents.find(i => i.incident_id === id);
const openIncidents = () => S.incidents.filter(i => i.status === 'OPEN').sort((a, b) => CAT_ORDER[a.category] - CAT_ORDER[b.category] || toM(a.opened_at) - toM(b.opened_at));
const incEquipment = i => i.equipment_id || (i.work_order_id ? S.wo[i.work_order_id]?.equipment_id : null);
const isDelayed = w => w.status !== 'COMPLETED' && toM(w.planned_end_at) <= S.now;
const blockWos = b => woList().filter(w => w.block_id === b).sort((x, y) => proc(x.process_id).sequence_no - proc(y.process_id).sequence_no);
const currentWo = b => blockWos(b).find(w => w.status !== 'COMPLETED') || null;
const woHistory = wo => S.history.filter(h => h.work_order_id === wo);
const lastHistory = wo => woHistory(wo).pop();
const todayWos = () => woList().filter(w => w.planned_start_at.startsWith(DAY)).sort((a, b) => proc(a.process_id).sequence_no - proc(b.process_id).sequence_no);
const transferWo = b => blockWos(b).find(w => w.process_id === 'P06');

function opMinutes(fromS, toMin) {
  let t = 0; const a = toM(fromS);
  for (let d = Math.floor(a / 1440) * 1440; d < toMin; d += 1440) { const s = Math.max(a, d + 480), e = Math.min(toMin, d + 960); if (e > s) t += e - s; }
  return t;
}
function eqMinutes(eq, status) {
  const from = toM(OP_START);
  return S.intervals.filter(i => i.eq === eq && i.status === status).reduce((t, i) => t + Math.max(0, Math.min(i.e ?? S.now, S.now) - Math.max(i.s, from)), 0);
}
function occupancy(eq) { const den = opMinutes(OP_START, S.now), run = eqMinutes(eq, 'RUNNING'); return { run, den, pct: den ? run / den * 100 : 0 }; }
function segments(eq) {
  const out = [];
  for (const i of S.intervals.filter(x => x.eq === eq).sort((a, b) => a.s - b.s)) {
    const e = i.e ?? S.now, p = out[out.length - 1];
    if (p && p.status === i.status && p.e === i.s && (p.wo || null) === (i.wo || null)) p.e = e; else out.push({ ...i, e });
  }
  return out;
}
function faultStats(eq) { const f = segments(eq).filter(s => s.status === 'FAULT'); return { min: f.reduce((t, s) => t + s.e - s.s, 0), count: f.length }; }
function statusSince(eq) {
  const segs = segments(eq); const last = segs[segs.length - 1];
  if (!last || last.status !== eqOf(eq).status) return 0;
  let s = last.s;
  for (let k = segs.length - 2; k >= 0 && segs[k].status === last.status && segs[k].e === s; k--) s = segs[k].s;
  return S.now - s;
}
function kpis() {
  const eqs = Object.values(S.equipment); const cnt = st => eqs.filter(e => e.status === st).length;
  const today = todayWos(), due = woList().filter(w => toM(w.planned_end_at) <= S.now);
  const transferred = Object.values(S.blocks).filter(b => transferWo(b.block_id)?.status === 'COMPLETED');
  const onTime = transferred.filter(b => { const w = transferWo(b.block_id); return w.actual_end_at && toM(w.actual_end_at) <= toM(b.target_transfer_at); });
  return {
    total: eqs.length, running: cnt('RUNNING'), idle: cnt('IDLE'), fault: cnt('FAULT'), maint: cnt('MAINTENANCE'),
    todayDone: today.filter(w => w.status === 'COMPLETED').length, todayTotal: today.length, overdue: woList().filter(isDelayed), open: openIncidents().length,
    transferred: transferred.length, blocks: Object.keys(S.blocks).length, dueDone: due.filter(w => w.status === 'COMPLETED').length, dueTotal: due.length,
    onTime: onTime.length, inspPass: S.inspections.filter(q => q.result === 'PASS').length, inspTotal: S.inspections.length,
  };
}
function processActual() {
  return Object.values(S.processes).sort((a, b) => a.sequence_no - b.sequence_no).map(p => {
    const ws = woList().filter(w => w.process_id === p.process_id && toM(w.planned_end_at) <= S.now);
    const a = ws.reduce((t, w) => t + w.accepted_qty, 0), pl = ws.reduce((t, w) => t + w.planned_qty, 0);
    return { p, a, pl, pct: pl ? a / pl * 100 : null, unit: unit(p.unit) };
  });
}
if (false) module.exports = { buildState, setS: s => { S = s; }, kpis, processActual, occupancy, faultStats, statusSince, segments, openIncidents, toM };

// 서버 연결 계층. 기본은 Supabase(supabase-js). 자동 테스트에서는 window.__TP_TEST_API(같은 SQL을 올린 로컬 Postgres)를 쓴다.
const TABLES = ['vessels', 'zones', 'processes', 'equipment', 'equipment_snapshot', 'blocks', 'status_codes', 'work_orders', 'production_plan', 'production_actual',
  'equipment_intervals', 'incidents', 'incident_actions', 'work_history', 'inspections', 'rework', 'sim_clock', 'event_log'];
const LS = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const BUILT_URL = 'https://rrgvqgphhwzkeuvdwndu.supabase.co', BUILT_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZ3ZxZ3BoaHd6a2V1dmR3bmR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MDA3OTAsImV4cCI6MjEwNzM3Njc5MH0.6dnywttjbB77nPBOAPNY-SSPDH1onNmdgx80QRJ1mPU';
const SUPABASE_URL = LS('tpSupabaseUrl') || BUILT_URL, SUPABASE_ANON_KEY = LS('tpSupabaseKey') || BUILT_KEY;
const NEEDS_SETUP = !window.__TP_TEST_API && (!/^https:\/\//.test(SUPABASE_URL) || SUPABASE_ANON_KEY.startsWith('__'));
let DEMO_CODE = (() => { try { return sessionStorage.getItem('tpDemoCode') || ''; } catch (e) { return ''; } })();
function setDemoCode(c) { DEMO_CODE = c; try { sessionStorage.setItem('tpDemoCode', c); } catch (e) { /* 저장 불가 환경 */ } API.resetWriter && API.resetWriter(); }
const SERVER_LABEL = window.__TP_TEST_API ? '로컬 Postgres(테스트)' : 'Supabase Postgres';
const API = NEEDS_SETUP ? null : window.__TP_TEST_API ? {
  load: () => window.__TP_TEST_API.load(),
  rpc: (fn, args) => window.__TP_TEST_API.rpc(fn, args, DEMO_CODE),
  subscribe: () => {},
} : (() => {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  let writer = null;   // 쓰기용 클라이언트: 시연 코드를 x-demo-code 헤더로 보낸다
  const getWriter = () => writer || (writer = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, storageKey: 'tp-writer' }, global: { headers: { 'x-demo-code': DEMO_CODE } } }));
  async function all(t) {           // 1000행 제한을 넘는 표도 끝까지 읽는다
    let out = [], from = 0;
    for (;;) { const { data, error } = await sb.from('tp_' + t).select('*').range(from, from + 999); if (error) throw new Error(`${t}: ${error.message}`); out = out.concat(data); if (data.length < 1000) return out; from += 1000; }
  }
  return {
    async load() { const r = await Promise.all(TABLES.map(all)); return Object.fromEntries(TABLES.map((t, i) => [t, r[i]])); },
    resetWriter() { writer = null; },
    async rpc(fn, args) { const { data, error } = await getWriter().rpc(fn, args); if (error) throw new Error(error.message); return data; },
    subscribe(onChange, onStatus) {
      sb.channel('tp-all').on('postgres_changes', { event: '*', schema: 'public' }, p => { if (String(p.table).startsWith('tp_')) onChange(); })
        .subscribe(s => onStatus(s === 'SUBSCRIBED' ? '실시간 연결' : s === 'CLOSED' || s === 'CHANNEL_ERROR' || s === 'TIMED_OUT' ? '실시간 끊김 · 조작 후 다시 읽음' : '연결 중'));
    },
  };
})();

function cardInfo(w) {
  const e = eqOf(w.equipment_id); const inc = w.hold_incident && incById(w.hold_incident);

  if (e.status === 'IDLE' && w.status === 'BLOCKED' && inc?.category === 'MATERIAL') b = ['cat', 'MATERIAL', '자재 대기'];
  const c = STATUS[b[0]][b[1]][1];
  let sub = '', red = false;
  if (w.status === 'COMPLETED') sub = `${proc(w.process_id).process_name} 완료`;
  else if (w.status === 'BLOCKED') {
    if (inc?.category === 'EQUIPMENT') { sub = `${hm(inc.opened_at)}~ 중단 ${S.now - toM(inc.opened_at)}분`; red = true; }
    else sub = inc ? inc.summary : '보류';
  } else if (w.status === 'IN_PROGRESS') {
    const q = S.incidents.find(i => i.status === 'OPEN' && i.category === 'QUALITY' && i.work_order_id === w.work_order_id);
    const lastQ = S.inspections.filter(x => x.work_order_id === w.work_order_id).pop();
    sub = q ? `${lastQ?.failed_points ?? ''}개 불합격 · 재검` : w.forecast_end_at && toM(w.forecast_end_at) > S.now ? `${hm(w.forecast_end_at)} 완료 예상` : '진행 중';

  return { e, b, c, sub, red };
}

const ST_ORDER = { BLOCKED: 0, IN_PROGRESS: 1, COMPLETED: 2, PLANNED: 3 };
function woRows() {
  const f = UI.f.wo;
  const inDate = w => f.date === '' ? true : f.date === '16-17' ? /2026-09-1[67]/.test(w.planned_start_at) : w.planned_start_at.startsWith(`2026-09-${f.date}`);
  return woList().filter(w => inDate(w) && (!f.proc || w.process_id === f.proc) && (!f.st || w.status === f.st) && (!f.q || (w.block_id + w.work_order_id).toLowerCase().includes(f.q.toLowerCase())) && (!f.overdue || isDelayed(w)))
    .sort((a, b) => a.planned_start_at.localeCompare(b.planned_start_at) || ST_ORDER[a.status] - ST_ORDER[b.status] || b.work_order_id.localeCompare(a.work_order_id));
}

function csvData(kind) {
  if (kind === 'eq') return [['설비코드', '설비명', '공정', '자원', '상태', '점유율(%)', '연관 작업'], ...eqRows().map(e => [e.equipment_id, e.equipment_name, proc(e.process_id).process_name, e.resource_kind, STATUS.eq[e.status][0], occupancy(e.equipment_id).pct.toFixed(1), e.work_order_id || ''])];
  if (kind === 'prod') return [['블록', '블록명', '호선', '중량(t)', '현재 공정', '작업 상태', '진척(%)', '목표 이송', '지연'], ...blockRows().map(b => { const c = currentWo(b.block_id); return [b.block_id, b.block_name, b.vessel_id, b.weight_t, c ? proc(c.process_id).process_name : '이송 완료', STATUS.wo[c ? c.status : 'COMPLETED'][0], ((c ? c.progress_ratio : 1) * 100).toFixed(1), b.target_transfer_at, blockWos(b.block_id).some(isDelayed) ? '지연' : '']; })];
  if (kind === 'wo') return [['작업지시', '블록', '공정', '설비', '계획 시작', '계획 종료', '작업 상태', '인정수량', '계획수량', '단위', '진행률(%)', '지연'], ...woRows().map(w => [w.work_order_id, w.block_id, proc(w.process_id).process_name, w.equipment_id, w.planned_start_at, w.planned_end_at, STATUS.wo[w.status][0], w.accepted_qty, w.planned_qty, unit(w.unit), (w.progress_ratio * 100).toFixed(1), isDelayed(w) ? '지연' : ''])];
  if (kind === 'his') return [['이력 ID', '시각', '작업지시', '구분', '사건', '내용', '출처'], ...S.history.slice().reverse().map(h => [h.history_id, h.event_at, h.work_order_id, STATUS.his[h.event_type] || h.event_type, h.incident_id || '', h.note || '', h.source === 'demo' ? '시연' : '엑셀'])];
  if (kind === 'baseProc') return [['순서', '공정 코드', '공정명', '작업구역', '단위', '기준 경과시간'], ...Object.values(S.processes).sort((a, b) => a.sequence_no - b.sequence_no).map(p => [p.sequence_no, p.process_id, p.process_name, p.zone_id, unit(p.unit), p.standard_hours])];
  return [['설비코드', '설비명', '공정', '작업구역', '자원', '비고', '상태'], ...Object.values(S.equipment).map(e => [e.equipment_id, e.equipment_name, e.process_id, e.zone_id, e.resource_kind, e.capacity_note, STATUS.eq[e.status][0]])];
}
const CSV_NAME = { eq: '설비목록', prod: '블록별진행', wo: '작업지시', his: '작업이력', baseProc: '공정', baseEq: '설비' };
function exportCsv(kind) {
  const data = csvData(kind);
  const csv = '﻿' + data.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const tsv = data.map(r => r.map(v => String(v ?? '').replace(/\t|\n/g, ' ')).join('\t')).join('\n');
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `TWINPRO_${CSV_NAME[kind]}_${hm(nowS()).replace(':', '')}.csv`; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { /* 다운로드가 막힌 환경 */ }
  navigator.clipboard?.writeText(tsv).then(() => toast(`${data.length - 1}행을 CSV로 저장하고 클립보드에도 복사했습니다(엑셀에 붙여넣기 가능).`), () => toast(`${data.length - 1}행 CSV 파일을 만들었습니다.`));
  return data;
}

let toastTimer;
function toast(msg, ng) { let t = document.getElementById('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.className = 'toast' + (ng ? ' ng' : ''); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 5200); }
async function call(fn, args, after) {
  if (UI.busy) return; UI.busy = true; document.body.style.cursor = 'progress';
  try { const r = await API.rpc(fn, args); toast(r.msg || (r.ok ? '완료' : '실패'), !r.ok);
    if (!r.ok && /시연 코드/.test(r.msg)) { UI.canWrite = false; UI.codeOpen = true; }
    if (r.ok && after) after(); await reload(); return r; }
  catch (e) { toast('서버 호출 실패: ' + (e.message || e), true); }
  finally { UI.busy = false; document.body.style.cursor = ''; }
}
function render() {

  window.scrollTo(sx, sy);
}

  procSave(pid) { call('tp_rename_process', { p_pid: pid, p_name: draft('procName', S.processes[pid].process_name) }, () => delete UI.draft.procName); },
  csv(k) { exportCsv(k); },
  copySummary() { const t = summaryText(kpis()); navigator.clipboard?.writeText(t).then(() => toast('운영 요약을 복사했습니다.'), () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('summaryText')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('복사가 막혀 있어 요약 문장을 선택해 두었습니다. Ctrl+C로 복사하세요.'); }); },
};
function clearWoDraft() { for (const k of ['woEq', 'woStatus', 'woQty', 'woHold', 'woMemo']) delete UI.draft[k]; }
const FILTER = {
  eqProc: v => UI.f.eq.proc = v, eqSt: v => UI.f.eq.st = v, eqQ: v => UI.f.eq.q = v, eqKind: v => UI.f.eq.kind = v,
  prodVessel: v => UI.f.prod.vessel = v, prodProc: v => UI.f.prod.proc = v, prodSt: v => UI.f.prod.st = v, prodQ: v => UI.f.prod.q = v,
  woProc: v => UI.f.wo.proc = v, woSt: v => UI.f.wo.st = v, woDate: v => UI.f.wo.date = v, woQ: v => UI.f.wo.q = v, woOver: (v, el) => UI.f.wo.overdue = el.checked,
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  if (t.tagName === 'TR' && e.target.closest('button,a,input,select,textarea') && e.target.closest('[data-act]') !== t) return;
  e.preventDefault(); const fn = ACT[t.dataset.act]; if (fn) fn(t.dataset.arg);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.draft) { UI.draft[el.dataset.draft] = el.value; if (el.dataset.draft === 'hisQ') { UI.page.his = 1; render(); } return; }
  if (el.dataset.filter && el.type === 'text') { FILTER[el.dataset.filter](el.value, el); UI.page.wo = 1; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'codeIn') { e.preventDefault(); UI.draft.codeIn = e.target.value; ACT.codeSave(); } });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.draft && el.tagName === 'SELECT') { UI.draft[el.dataset.draft] = el.value; return; }
  if (el.dataset.filter && el.type !== 'text') { FILTER[el.dataset.filter](el.value, el); UI.page.wo = 1; render(); }
});

// ---------- 서버 연결 ----------
let reloadTimer = null;
async function reload() { const rows = await API.load(); S = buildState(rows); render(); }
function scheduleReload() { clearTimeout(reloadTimer); reloadTimer = setTimeout(() => reload().catch(e => toast('다시 읽기 실패: ' + e.message, true)), 250); }
function setupScreen() {
  document.getElementById('app').innerHTML = `<div class="content" style="max-width:640px;margin:48px auto"><div class="ptitle"><h1>서버 연결 설정</h1></div>
    <p>Supabase 프로젝트의 <b>Project URL</b>과 <b>anon public 키</b>를 입력하세요. (Supabase 대시보드 → Project Settings → API) 이 브라우저에만 저장됩니다.</p>
    <div class="form"><div class="frow"><span>Project URL</span><div><input id="sUrl" placeholder="https://xxxx.supabase.co"></div></div>
    <div class="frow"><span>anon 키</span><div><input id="sKey" placeholder="eyJ..."></div></div></div>
    <div class="row"><span class="grow"></span><button class="btn pri" id="sSave">저장하고 연결</button></div></div>`;
  document.getElementById('sSave').onclick = () => { try { localStorage.setItem('tpSupabaseUrl', document.getElementById('sUrl').value.trim()); localStorage.setItem('tpSupabaseKey', document.getElementById('sKey').value.trim()); } catch (e) { /* 저장 불가 */ } location.reload(); };
}
async function boot() {
  if (NEEDS_SETUP) return setupScreen();
  try { await reload(); UI.conn = '실시간 연결';
    if (DEMO_CODE) { const r = await API.rpc('tp_check_code', {}).catch(() => ({ ok: false })); UI.canWrite = !!r.ok; } API.subscribe(scheduleReload, s => { UI.conn = s; render(); }); render(); }
  catch (e) { document.getElementById('app').innerHTML = `<div class="content"><h1>서버에 연결하지 못했습니다</h1><p>${esc(e.message || e)}</p><p class="small">설정의 Supabase 주소와 공개 키를 확인하세요.</p></div>`; }
}

boot();</script></body></html>
